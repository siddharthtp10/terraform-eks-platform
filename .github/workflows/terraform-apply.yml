# Apply: MANUAL ONLY, and gated by a GitHub Environment with required reviewers.
#
# WHY NOT AUTO-APPLY ON MERGE? This stack creates an EKS cluster, a NAT gateway and
# a node, all billed by the hour. A merge (even of a README typo) must never silently
# start that meter. Here a human clicks "Run workflow" AND a reviewer approves the
# deployment, so cost is always a conscious decision.
#
# HOW A REAL TEAM MIGHT ALLOW AUTO-APPLY: for cheap or low-risk stacks (DNS, IAM
# groups, a dev S3 bucket) trigger on `push: branches: [main]` with `paths:` filtered
# to that stack's folder, and give it its own environment/role with no required
# reviewer but a deployment-branch rule limited to main. Keep expensive or
# destructive stacks (clusters, databases, anything with prevent_destroy) behind
# approval, and always require plan review in the PR first.
name: Terraform Apply (envs/dev)

on:
  workflow_dispatch: {}

permissions: {}

# Never two applies at once; and never cancel one halfway through.
concurrency:
  group: terraform-apply-envs-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  # Region and state key come from the repository variables AWS_REGION and
  # TF_STATE_KEY (the same single source terraform-pr.yml uses), not from this file.

jobs:
  apply:
    name: terraform apply
    # Only the main branch may deploy (also enforce this in the environment settings).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The job pauses here until a required reviewer approves. Because it runs in this
    # environment, its OIDC `sub` claim becomes
    #   repo:<owner>/<repo>:environment:dev-apply
    # which is exactly what the apply role's trust policy requires.
    environment: dev-apply
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_admin_principal_arn: ${{ secrets.ADMIN_PRINCIPAL_ARN }}
      TF_VAR_api_allowed_cidrs: ${{ secrets.API_ALLOWED_CIDRS }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require repository variables
        run: |
          for v in AWS_REGION TF_STATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set (Settings > Secrets and variables > Actions > Variables). See docs/ci-setup.md."
              exit 1
            fi
          done

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Mask sensitive values in logs
        run: |
          echo "$TF_VAR_api_allowed_cidrs" | jq -r '.[]' | while read -r cidr; do
            echo "::add-mask::$cidr"
            echo "::add-mask::${cidr%/*}"
          done

      - name: Assume the apply role via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }} # an ENVIRONMENT secret
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=envs/dev init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      # Plan and apply in the SAME job from a saved plan file, so what runs is exactly
      # what was planned. The file stays on the runner (never uploaded as an artifact:
      # artifacts on a public repo are downloadable by anyone, and plans can hold secrets).
      - name: terraform plan
        run: terraform -chdir=envs/dev plan -input=false -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform -chdir=envs/dev apply -input=false -lock-timeout=5m tfplan
