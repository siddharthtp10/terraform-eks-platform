# Pull request checks: format, validate, lint, security scan, then a read-only plan
# posted back to the PR. NOTHING here can change infrastructure.
#
# ACTION PINNING: every third-party action is pinned to a full commit SHA, with the
# human-readable version in a comment. A tag like @v4 is a movable pointer: if an
# action's repo is compromised, the attacker can re-point the tag at malicious code
# and every workflow using it runs that code (with access to this job's secrets and
# OIDC token). A SHA is immutable. Dependabot/Renovate can bump SHAs via PRs.
name: Terraform PR

on:
  pull_request:
    branches: [main]

# Deny everything by default; each job below grants only what it needs.
permissions: {}

# A new push to the PR cancels the previous run instead of queueing duplicates.
concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  # Region and state key are NOT written here: they come from the repository
  # variables AWS_REGION and TF_STATE_KEY (Settings > Secrets and variables >
  # Actions > Variables), the single source shared by every workflow.

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: no cloud credentials at all.
  # ---------------------------------------------------------------------------
  static:
    name: fmt / validate / tflint / security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # wrapper mangles stdout; we want raw output

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive -diff

      # Misconfiguration scan of the Terraform code. exit-code 1 + severity filter =
      # the job FAILS on any HIGH or CRITICAL finding (lower severities are ignored
      # here, not hidden: run `trivy config .` locally to see them).
      # Reviewed, accepted findings are suppressed in code with a justification and an
      # expiry (search for "trivy:ignore"), never by weakening this gate.
      #
      # ORDER MATTERS: this runs BEFORE `terraform init`. init downloads the community
      # modules (with their examples/ folders) into .terraform/; scanning after it made
      # Trivy report findings in third-party example manifests that are not our code,
      # and failed every run. Trivy fetches the modules it needs by itself, and
      # skip-dirs keeps any .terraform folder out of the scan as a second guard.
      - name: Security scan (Trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: "**/.terraform"
          version: v0.75.0

      - name: terraform validate (every root module)
        run: |
          for dir in bootstrap ci-access envs/dev; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0 # pinned: an unpinned CLI would change under us between runs
          github_token: ${{ github.token }} # avoids API rate limits when fetching rulesets

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          for dir in bootstrap ci-access envs/dev; do
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --format compact
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Plan: the only job that talks to AWS. Read-only role, assumed through OIDC.
  # Runs only for PRs from THIS repo: PRs from forks get no secrets and no OIDC
  # token, and shouldn't be able to run code with our role anyway.
  # ---------------------------------------------------------------------------
  plan:
    name: terraform plan (read-only)
    needs: static
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request the OIDC token (and nothing else)
      contents: read
    env:
      TF_VAR_admin_principal_arn: ${{ secrets.ADMIN_PRINCIPAL_ARN }}
      TF_VAR_api_allowed_cidrs: ${{ secrets.API_ALLOWED_CIDRS }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }} # envs/dev uses the same region as the workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require repository variables
        run: |
          for v in AWS_REGION TF_STATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set (Settings > Secrets and variables > Actions > Variables). See docs/ci-setup.md."
              exit 1
            fi
          done

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The repo is public, so job logs are public too. GitHub masks secret values
      # in logs, but a list inside a secret is only masked as a whole string; mask each
      # address on its own so a plan that prints them doesn't leak your IP.
      - name: Mask sensitive values in logs
        run: |
          echo "$TF_VAR_api_allowed_cidrs" | jq -r '.[]' | while read -r cidr; do
            echo "::add-mask::$cidr"
            echo "::add-mask::${cidr%/*}"
          done

      - name: Assume the plan role via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # mask-aws-account-id defaults to true: the account ID is masked in logs.

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=envs/dev init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      # -lock=false: this role is read-only on the bucket, so it can't write the
      # lock file; concurrent PR plans are harmless because plans don't change state.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=envs/dev plan -input=false -lock=false -no-color > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # The PR comment on a PUBLIC repo is public. Redact account IDs and IPv4
      # addresses, and cap the size (GitHub limits comments to ~65k characters).
      - name: Build redacted plan comment
        run: |
          {
            echo '<!-- terraform-plan -->'
            echo '### Terraform plan (`envs/dev`)'
            if [ "${{ steps.plan.outputs.exitcode }}" != "0" ]; then echo '**:x: plan failed**'; fi
            echo '<details><summary>Show plan (account IDs and IPs redacted)</summary>'
            echo
            echo '```'
            sed -E 's/[0-9]{12}/************/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}(\/[0-9]+)?/<ip-redacted>/g' plan.txt | head -c 55000
            echo '```'
            echo '</details>'
          } > plan-comment.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-comment
          path: plan-comment.md # only the redacted text; never upload the binary plan
          retention-days: 3

      - name: Fail the job if the plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Comment: has write access to PRs but NO cloud access and NO OIDC token, so a
  # compromise of this job cannot touch AWS. Splitting jobs keeps each one minimal.
  # ---------------------------------------------------------------------------
  comment:
    name: post plan to PR
    needs: plan
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-comment

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan-comment.md', 'utf8');
            const marker = '<!-- terraform-plan -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // One "sticky" comment, updated on every push, instead of a new one each time.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
